name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
    # A ledger-only push (the nightly ledger-upkeep job) changes nothing
    # the site is built from (claude-config CC71).
    paths-ignore:
      - "LEDGER.md"
      - "docs/ledger_*.md"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=levi-dev --branch=master --commit-hash=${{ github.sha }}
